[project]
name = "st-mcp"
version = "0.1.0"
description = "MCP server wrapping SillyTavern's internal REST API for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "haint", email = "thanhhai9x98@gmail.com" }
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
st-mcp = "st_mcp.server:main"
