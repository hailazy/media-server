# Forge models manifest — source of truth for disaster recovery
#
# Pull all: ./scripts/forge-pull-models.sh
# Pull one: ./scripts/forge-pull-models.sh --only NoobAI-XL-v1.1
# Verify:   ./scripts/forge-pull-models.sh --check
#
# Sources:
#   hf://<repo>/<file>           HuggingFace (huggingface-cli download)
#   civitai://<modelVersionId>   Civitai (needs CIVITAI_API_KEY in .env)
#   url://<full-url>             Direct download (curl/wget)
#
# target_dir: relative to forge/data/forge/models/
#
# sha256 (optional): if set, verified after download. Generate with:
#   sha256sum <file>

# ─────────────────────────────────────────────────────────────
# Checkpoints (~6.7GB)
# ─────────────────────────────────────────────────────────────
checkpoints:
  - name: NoobAI-XL-v1.1.safetensors
    source: hf://Laxhar/noobai-XL-1.1/noobaiXL_v11.safetensors
    target_dir: Stable-diffusion
    # sha256: TBD — fill after first verified download

